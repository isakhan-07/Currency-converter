<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-image">
                <svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <linearGradient id="coinGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#818cf8"/>
                            <stop offset="100%" stop-color="#6366f1"/>
                        </linearGradient>
                        <linearGradient id="coinGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#c084fc"/>
                            <stop offset="100%" stop-color="#a855f7"/>
                        </linearGradient>
                        <linearGradient id="billGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#10b981"/>
                            <stop offset="100%" stop-color="#059669"/>
                        </linearGradient>
                    </defs>

                    <rect x="20" y="40" width="110" height="58" rx="8" fill="url(#billGrad)" opacity="0.9"/>
                    <rect x="30" y="50" width="90" height="38" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
                    <circle cx="75" cy="69" r="11" fill="#ffffff" opacity="0.85"/>
                    <text x="75" y="74" font-size="14" font-weight="700" text-anchor="middle" fill="#059669">$</text>

                    <circle cx="130" cy="42" r="26" fill="url(#coinGrad1)"/>
                    <circle cx="130" cy="42" r="20" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
                    <text x="130" y="50" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">€</text>

                    <circle cx="165" cy="78" r="22" fill="url(#coinGrad2)"/>
                    <circle cx="165" cy="78" r="16" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
                    <text x="165" y="85" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">¥</text>

                    <path d="M40 20 Q70 5 100 20" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="5 4"/>
                    <path d="M100 20 L94 13 M100 20 L93 24" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>Конвертер валют</h1>
            <p class="subtitle">Быстрый расчёт по актуальным курсам</p>
            <div class="ai-status" id="aiStatus">
                <span class="status-dot loading"></span>
                <span class="status-text">Загрузка курсов...</span>
            </div>
        </header>

        <main class="converter">
            <div class="field">
                <label for="amount">Сумма</label>
                <input type="number" id="amount" value="1" min="0" step="any" placeholder="Введите сумму">
            </div>

            <div class="row">
                <div class="field">
                    <label for="from">Из валюты</label>
                    <select id="from"></select>
                </div>

                <button class="swap-btn" id="swapBtn" title="Поменять местами" aria-label="Поменять валюты местами">
                    ⇄
                </button>

                <div class="field">
                    <label for="to">В валюту</label>
                    <select id="to"></select>
                </div>
            </div>

            <button class="convert-btn" id="convertBtn">Конвертировать</button>

            <div class="result" id="result">
                <span class="result-placeholder">Результат появится здесь</span>
            </div>

            <div class="rate-info" id="rateInfo"></div>
        </main>

        <section class="records">
            <div class="records-header">
                <h2>История рекордов</h2>
                <button class="clear-btn" id="clearBtn">Очистить</button>
            </div>
            <ul class="records-list" id="recordsList">
                <li class="empty">Пока нет записей</li>
            </ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
